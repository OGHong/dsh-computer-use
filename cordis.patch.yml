# dsh-computer-use bundle patch: 把内置的 computer-use MCP 服务器注册为一个
# mcp-client 实例。行 id 为 `computer-use`，profile 自己的 cordis.patch.yml 可
# 用以下方式覆盖配置（例如换 Python 解释器路径）：
#
#   - id: computer-use
#     config:
#       command: /usr/bin/python3
#
# command/args 必须是**本机插件目录**下的绝对路径（下面两行）：dsh 的 patch 加载只把
# insert 的 name 解析成文件 URL，config 值原样交给 mcp-client，没有占位符可用 —— 所以
# **仓库里这两行是占位符**，跑一次 `sh scripts/install.sh` 会按脚本所在目录把它们改写成
# 真实路径（README「安装」/「换一台 Mac」两节）。
# venv 建法见 README（一句话：python3 -m venv .venv &&
# .venv/bin/pip install -r server/requirements.txt）。
# 这里指向 venv 的解释器就行 —— 服务器启动时会把自己换进
# `runtime/DshComputerUse.app`（LSUIElement 自建 bundle，避免 Dock 上攒 Python 图章，
# 见 README「Dock 上不留 Python 图章」）。要关掉这个替换：env 里设 DSH_CUA_NO_REEXEC=1。
# 首次使用需在 系统设置 → 隐私与安全性 中给 DeepSeek Harness 授予
# 「辅助功能」和「屏幕录制」两项权限，否则截图黑屏、点击无效。

- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: computer-use
        command: /path/to/dsh-computer-use/.venv/bin/python
        args:
          - /path/to/dsh-computer-use/server/server.py
        env: {}
        # 客户端等待工具返回的上限，需大于服务器端 run_shell 的 60 秒自杀线
        toolCallTimeoutMs: 120000
    # 本插件自身的 Host 半区（lib/index.js，由 src/index.ts 构建而来）：挂
    # /_computer-use/stream、/_computer-use/preview.jpg、/_computer-use/status.json
    # 三条路由（给预览浮窗与（退休的）内嵌卡片供帧和状态），外加设置页
    # （Settings → 电脑操控）用的 settings.json / permissions，以及导航图标补丁的自检上报
    # nav-icon —— 见 README「设置页」一节。客户端半区是 client/settings.js
    # （package.json 的 dsh.client）。
    # 它同时负责帧管线（定时器 + SCK 抓屏子进程），这些都挂在 ctx.effect 上，
    # 插件卸载或热替换时一起归还 —— 抓屏进程漏掉会让系统录屏灯一直亮。
    - id: computer-use-host
      name: 'dsh-computer-use'
      config: {}
